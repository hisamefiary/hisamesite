<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>クロの空想帳計算機Ver5.0</title>
  <meta name="description" content="クロの空想帳のリセットを計算機" />

  <link rel="icon" href="../../other/icon.png">
  <link rel="stylesheet" href="../../other/general.css">
  <script type="text/javascript" src="../../other/general.js"></script>

  <link rel="stylesheet" href="../../other/headerfooter.css">
  <script type="text/javascript" src="../../other/headerfooter.js"></script>

  <script>window.fia_data = { header: undefined, footer: 'xivtool', }</script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let update_log_txt = {
        bug_list: ["現在ありません",],
        next_list: ["現在ありません",],
        update_list: [
          [["Ver5.0", "(2025/12/03)"], ["システム周りの調整を行いました"],],
          [["Ver4.0", "(2025/06/22)"], ["公開しました"],],
        ],
      }
      update_create(update_log_txt)
    })
  </script>

  <link rel="stylesheet" href="main.css">
  <script type="text/javascript" src="main.js"></script>

  <script type="text/javascript" src="data.js"></script>
</head>

<body>
  <main>
    <div id="flex_mother">
      <div id="base">
        <input type="checkbox" id="cell_0">
        <input type="checkbox" id="cell_1">
        <input type="checkbox" id="cell_2">
        <input type="checkbox" id="cell_3">
        <input type="checkbox" id="cell_4">
        <input type="checkbox" id="cell_5">
        <input type="checkbox" id="cell_6">
        <input type="checkbox" id="cell_7">
        <input type="checkbox" id="cell_8">
        <input type="checkbox" id="cell_9">
        <input type="checkbox" id="cell_10">
        <input type="checkbox" id="cell_11">
        <input type="checkbox" id="cell_12">
        <input type="checkbox" id="cell_13">
        <input type="checkbox" id="cell_14">
        <input type="checkbox" id="cell_15">
      </div>
      <button id="reset_button">リセット</button>
      <table id="result_table">
        <thead>
          <tr id="BINGOsum">
            <th class="tablehead">ビンゴ数</th>
            <th class="tableA">通り数</th>
            <th class="table0">0</th>
            <th class="table1">1</th>
            <th class="table2">2</th>
            <th class="table3">3</th>
          </tr>
        </thead>
        <tbody>
          <tr id="pattern">
            <th class="tablehead">通り数</th>
            <td class="tableA">変動</td>
            <td class="table0">変動</td>
            <td class="table1">変動</td>
            <td class="table2">変動</td>
            <td class="table3">変動</td>
          </tr>
          <tr id="percent">
            <th class="tablehead">確率</th>
            <td class="tableA">／</td>
            <td class="table0">変動</td>
            <td class="table1">変動</td>
            <td class="table2">変動</td>
            <td class="table3">変動</td>
          </tr>
          <tr id="reset">
            <th class="tablehead">リセ後確率</th>
            <td class="tableA">／</td>
            <td class="table0">41.54％</td>
            <td class="table1">47.90％</td>
            <td class="table2">10.35％</td>
            <td class="table3">0.21％</td>
          </tr>
          <tr id="BINGOpercent">
            <th class="tablehead">以上確率</th>
            <td class="tableA">／</td>
            <td class="table0">変動</td>
            <td class="table1">変動</td>
            <td class="table2">変動</td>
            <td class="table3">変動</td>
          </tr>
          <tr id="BINGOreset">
            <th class="tablehead">以上リセ後確率</th>
            <td class="tableA">／</td>
            <td class="table0">100.00％</td>
            <td class="table1">58.46％</td>
            <td class="table2">10.56％</td>
            <td class="table3">0.21％</td>
          </tr>
          <tr id="MGPdata">
            <th class="tablehead">MGP合算値</th>
            <td class="tableA">／</td>
            <td class="table0">0</td>
            <td class="table1">30,000</td>
            <td class="table2">130,000</td>
            <td class="table3">1,130,000</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div id="result_area">
      <p>
        <span id="finalresult0">変動％</span><br>
        <span id="finalresult1">変動％</span><br>
        <span>(MGPベース)</span><br>
      </p>
    </div>
    <div id="page_description">
      <p>
        クロの空想帳をリセットした場合の確率が分かる計算機です<br>
        最終的な評価値は、交換で得られるMGPで計算しています<br>
        2-3ビンゴ以上を狙いたい場合は、以上確率と以上リセ後確率を見てください<br>
      </p>
    </div>
  </main>
</body>

</html>
